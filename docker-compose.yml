services:

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: etudiants-postgres
    restart: always
    environment:
      POSTGRES_DB: etudiants_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d etudiants_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Base de données pour Grading Service ─────────────────
  grading-db:
    image: postgres:16-alpine
    container_name: grading-postgres
    restart: always
    environment:
      POSTGRES_DB: grading_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - grading_postgres_data:/var/lib/postgresql/data
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: etudiants-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Eureka Server (Service Discovery) ───────────────────
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: on-failure
    ports:
      - "8761:8761"
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Spring Boot (Etudiant Service) ──────────────────
  api:
    build:
      context: ./api-spring-boot
      dockerfile: Dockerfile
    container_name: etudiants-api
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/etudiants_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
      SPRING_APPLICATION_NAME: etudiant-service
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - etudiants-network

  # ── Grading Service (Gestion des Notes) ─────────────────
  grading-service:
    build:
      context: ./grading-service
      dockerfile: Dockerfile
    container_name: grading-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://grading-db:5432/grading_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
      SPRING_APPLICATION_NAME: grading-service
    depends_on:
      grading-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - etudiants-network

  # ── API Gateway (Point d'entrée unique) ─────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
      SPRING_APPLICATION_NAME: api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      api:
        condition: service_started
      grading-service:
        condition: service_started
    networks:
      - etudiants-network

  # ── Frontend Next.js ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: etudiants-frontend
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - etudiants-network

volumes:
  postgres_data:
  grading_postgres_data:

networks:
  etudiants-network:
    driver: bridge